name: test

on:
  push:
    branches: [ master ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      - run: yarn install --frozen-lockfile
      - run: yarn test
      # Arms the guards that only run at build time: checkBrowserBundle
      # (no Node builtins in the browser bundle) and the committed lib/
      # matching src/. lib/ is tracked, so its freshness is a
      # correctness property and needs enforcement.
      - run: yarn compile
      - run: git diff --exit-code lib/
